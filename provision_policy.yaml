provision:
  auto_install_tools: false
  auto_fix_permissions: false
  auto_fix_dma: false
  auto_install_kvm: false
  auto_load_modules: false
  auto_start_libvirt: false
  auto_start_network: false
  auto_create_vm: false
  auto_start_vm: false
  auto_fix_irq_affinity: false
  auto_download_image: false
virtualization:
  name: cpu-isolation-vm
  guest_user: tester
  base_image: /var/lib/libvirt/images/base/ubuntu-24.04-server-cloudimg-amd64.img
  auto_download_image: false
  base_image_url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
  checksum_url: https://cloud-images.ubuntu.com/releases/noble/release/SHA256SUMS
  base_image_sha256: ''
  download_timeout: 600
  download_retries: 2
validation_mode: verify
